name: agent-ok

# Игра «Варвары» через мобильную версию Одноклассников.
#
# Канал ОК нужен для аккаунта, привязанного к ОК (он не входит через
# логин/пароль на barbars.ru). Сессия ОК — это несколько cookie, которые
# лежат в секрете OK_SESSION_B64 (base64 от gzip(json)).
#
# Как подготовить секрет (один раз, на ПК):
#   1) python tools\ok_phone.py      — войти в ОК руками
#   2) python tools\ok_export_cookies.py
#   3) содержимое state\ok-session.b64 вставить в секрет OK_SESSION_B64
#
# ВНИМАНИЕ: секрет — это живая сессия вашего аккаунта ОК. Не публикуйте его
# и не коммитьте state\ok-session.b64 (он в .gitignore).

on:
  schedule:
    # cron-страховка: основной цикл держит самоперезапуск (шаг «Следующий сеанс»),
    # cron подхватывает, если цепочка оборвалась.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Сколько минут играть'
        default: '330'

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-ok
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Вход в ОК по логину и паролю
        env:
          OK_LOGIN: ${{ secrets.OK_LOGIN }}
          OK_PASSWORD: ${{ secrets.OK_PASSWORD }}
        run: |
          if [ -z "$OK_LOGIN" ] || [ -z "$OK_PASSWORD" ]; then
            echo 'секретов OK_LOGIN/OK_PASSWORD нет — берём сессию из OK_SESSION_B64'
            exit 0
          fi
          mkdir -p state logs
          python -u tools/ok_auto_login.py --out state --timeout 120
          echo "::add-mask::$(printf '%s' "$OK_PASSWORD" | head -c 2)"

      - name: Восстановить сессию ОК
        env:
          OK_SESSION_B64: ${{ secrets.OK_SESSION_B64 }}
        run: |
          if [ -s state/ok-session.b64 ]; then
            echo "сессия получена автовходом ($(wc -c < state/ok-session.b64) байт)"
            exit 0
          fi
          if [ -z "$OK_SESSION_B64" ]; then
            echo "::error::нет ни автовхода, ни секрета OK_SESSION_B64"; exit 1
          fi
          mkdir -p state
          printf '%s' "$OK_SESSION_B64" > state/ok-session.b64
          echo "сессия восстановлена ($(wc -c < state/ok-session.b64) байт)"

      - name: Игра
        run: |
          python -u run.py --config config-ok.json play-ok \
            --headless \
            --duration ${{ github.event.inputs.duration || '330' }}

      - name: Сохранить дневные счётчики
        if: always()
        run: |
          git config user.name 'barbars-bot'
          git config user.email 'bot@users.noreply.github.com'
          mkdir -p state/ok
          git add -A state/ok || true
          if git diff --cached --quiet; then
            echo 'счётчики не изменились'
          else
            git commit -m 'state(ok): дневные счётчики'
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi

      - name: Сессия ОК протухла — нужна помощь
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE='Сессия ОК протухла: обновите секрет OK_SESSION_B64'
          BODY='Агент не смог открыть игру через ОК (сессия из секрета недействительна). Обновите секрет: на ПК `python tools\\ok_phone.py` → `python tools\\ok_export_cookies.py` → `gh secret set OK_SESSION_B64 --repo p35084070-prog/barbars-agent --body (Get-Content state\\ok-session.b64 -Raw).Trim()`.'
          gh issue create --repo "${{ github.repository }}" \
            --title "$TITLE" --body "$BODY" \
            || echo 'не удалось создать issue'
          echo "::error::$TITLE"

      - name: Следующий сеанс
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/workflows/agent-ok.yml/dispatches" \
            -f ref=main \
            || echo 'не удалось запланировать следующий сеанс (подстрахует cron)'

      - name: Логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ok-${{ github.run_number }}
          path: logs/ok-cloud
          retention-days: 14
