name: probe-help

# Разведка справки и торговых страниц: с какого уровня открывается аукцион.
# Только чтение. Каждый аккаунт — отдельный шаг, сбой одного не мешает.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-help
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Учётные данные и сессии
        env:
          KEIS_LOGIN: ${{ secrets.BARBARS_KEIS_LOGIN }}
          KEIS_PASS: ${{ secrets.BARBARS_KEIS_PASSWORD }}
          FW_LOGIN: ${{ secrets.BARBARS_FIREWHITE_LOGIN }}
          FW_PASS: ${{ secrets.BARBARS_FIREWHITE_PASSWORD }}
          OK_SESSION_B64: ${{ secrets.OK_SESSION_B64 }}
          OK2_SESSION_B64: ${{ secrets.OK2_SESSION_B64 }}
        run: |
          mkdir -p credentials state/ok2
          printf '%s\n%s\n' "$KEIS_LOGIN" "$KEIS_PASS" > credentials/keis.txt
          printf '%s\n%s\n' "$FW_LOGIN" "$FW_PASS" > credentials/firewhite.txt
          chmod 600 credentials/*.txt
          if [ -n "$OK_SESSION_B64" ]; then printf '%s' "$OK_SESSION_B64" > state/ok-session.b64; fi
          if [ -n "$OK2_SESSION_B64" ]; then printf '%s' "$OK2_SESSION_B64" > state/ok2/ok-session.b64; fi

      - name: Справка — fire white ii (низкий уровень)
        continue-on-error: true
        run: python -u tools/probe_help_auction.py --config deploy/config-actions-firewhite.json --label firewhite --urls '/trade/auctions,/trade/auction,/help,/trade'

      - name: Справка — keis (высокий уровень)
        continue-on-error: true
        run: python -u tools/probe_help_auction.py --config deploy/config-actions-keis.json --label keis --urls '/trade/auctions,/trade/auction,/help,/trade'

      - name: Справка — qdal ОК2 (60 ур.)
        continue-on-error: true
        run: python -u tools/probe_help_auction.py --config config-ok2.json --label ok2 --urls '/trade/auctions,/trade/auction,/help,/trade'

      - name: Справка — vagojan ОК (64 ур.)
        continue-on-error: true
        run: python -u tools/probe_help_auction.py --config config-ok.json --label ok --urls '/trade/auctions,/trade/auction,/help,/trade'

      - name: Логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-help-${{ github.run_number }}
          path: logs
          retention-days: 7
