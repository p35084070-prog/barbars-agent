name: equip-steelblue

# Пятый герой: забирает посылку с снаряжением и надевает комплект.
# Экипировка работает только при `gear.auto_equip` в конфиге героя.

on:
  schedule:
    # раз в 2 часа: герой забирает посылки и надевает комплект, когда дойдёт до 25 уровня
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      hero_id:
        description: 'ID героя'
        default: '31390082'
      equip:
        description: 'Надеть вещи (true/false)'
        default: 'true'

permissions:
  contents: read

concurrency:
  group: equip-steelblue
  cancel-in-progress: false

jobs:
  equip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Креды из секретов
        env:
          SB_LOGIN: ${{ secrets.BARBARS_STEELBLUE_LOGIN }}
          SB_PASS: ${{ secrets.BARBARS_STEELBLUE_PASSWORD }}
        run: |
          mkdir -p credentials
          printf '%s\n%s\n' "$SB_LOGIN" "$SB_PASS" > credentials/steelblue.txt
          chmod 600 credentials/*.txt

      - name: Забрать почту и надеть
        env:
          HERO_ID: ${{ github.event.inputs.hero_id || '31390082' }}
          EQUIP: ${{ github.event.inputs.equip || 'true' }}
        run: |
          ARGS=""
          if [ "$EQUIP" = "true" ]; then ARGS="--equip"; fi
          python -u tools/equip_hero.py --config deploy/config-actions-steelblue.json \
            --hero-id "$HERO_ID" $ARGS
