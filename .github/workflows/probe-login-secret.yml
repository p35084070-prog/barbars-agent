name: probe-login-secret

# Проверка входа героя по кред��м из Secrets (пароль не публикуется).
# Печатает только результат входа и страницу героя.

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Логическое имя аккаунта'
        required: true
        default: 'steelblue'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Проверка входа
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          LOGIN=$(printf '%s' "${{ secrets[format('BARBARS_{0}_LOGIN', env.ACCOUNT)] }}")
          PW=$(printf '%s' "${{ secrets[format('BARBARS_{0}_PASSWORD', env.ACCOUNT)] }}")
          echo "ник из секрета: '$LOGIN' (длина ${#LOGIN}), пароль: (длина ${#PW})"
          python -u tools/check_login.py "$LOGIN" "$PW"
