name: agent-keis
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Только чтение вариантов почты, без отправки'
        default: '0'
permissions:
  contents: read
concurrency:
  group: inspect-mail-options-keis
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Прочитать доступные ресурсы, ничего не отправлять
        env:
          KEIS_LOGIN: ${{ secrets.BARBARS_KEIS_LOGIN }}
          KEIS_PASS: ${{ secrets.BARBARS_KEIS_PASSWORD }}
        run: python -u -m tools.inspect_mail_options
