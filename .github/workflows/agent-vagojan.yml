name: agent-vagojan

# Схема: длинный сеанс фарма (5,5 часа) + самоперезапуск + cron-страховка.
# Один запуск = одна сессия в игре (логин один раз), поэтому не нужно
# входить в игру каждые 15 минут.

on:
  # Расписание отключено 13.11.2026: у героя vagojan нет кредов от barbars.ru,
  # он обслуживается агентом agent-ok через канал ОК (hero_id 1286381).
  # Прогоны падали с «автовход не удался». workflow_dispatch оставлен на будущее,
  # когда появятся BARBARS_VAGOJAN_* секреты.
  # schedule:
  #   - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Сколько минут работать'
        default: '330'

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-vagojan
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Учётные данные из секретов
        env:
          VG_LOGIN: ${{ secrets.BARBARS_VAGOJAN_LOGIN }}
          VG_PASS: ${{ secrets.BARBARS_VAGOJAN_PASSWORD }}
        run: |
          mkdir -p credentials
          printf '%s\n%s\n' "$VG_LOGIN" "$VG_PASS" > credentials/vagojan.txt
          chmod 600 credentials/vagojan.txt

      - name: Фарм
        run: |
          python -u run.py play \
            --config deploy/config-actions-vagojan.json \
            --headless \
            --duration "${{ github.event.inputs.duration || '330' }}"

      - name: Сохранить дневные счётчики
        if: always()
        run: |
          git config user.name 'barbars-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add state/vagojan
          if git diff --cached --quiet; then
            echo 'счётчики не изменились'
          else
            git commit -m 'state(vagojan): дневные счётчики'
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi

      - name: Следующий сеанс
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/workflows/agent-vagojan.yml/dispatches" \
            -f ref=main \
            || echo 'не удалось запланировать следующий сеанс (подстрахует cron)'

      - name: Логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-vagojan-${{ github.run_number }}
          path: logs/vagojan
          retention-days: 14
