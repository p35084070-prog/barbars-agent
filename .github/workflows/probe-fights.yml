name: probe-fights

# Разведка боевых экранов: что реально нажимать в башне (после «Бить врагов»),
# в подземельях (после «Войти»), в замке (после «Войти в замок») и в очереди
# арены (после «Встать в очередь»). Только чтение, вход в игру.

on:
  workflow_dispatch:
    inputs:
      heroes:
        description: 'Кого опрашивать (keis,fw,sb)'
        default: 'fw,keis'

permissions:
  contents: read

concurrency:
  group: probe-fights
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Учётные данные из секретов
        env:
          KEIS_LOGIN: ${{ secrets.BARBARS_KEIS_LOGIN }}
          KEIS_PASS: ${{ secrets.BARBARS_KEIS_PASSWORD }}
          FW_LOGIN: ${{ secrets.BARBARS_FIREWHITE_LOGIN }}
          FW_PASS: ${{ secrets.BARBARS_FIREWHITE_PASSWORD }}
          SB_LOGIN: ${{ secrets.BARBARS_STEELBLUE_LOGIN }}
          SB_PASS: ${{ secrets.BARBARS_STEELBLUE_PASSWORD }}
        run: |
          mkdir -p credentials
          printf '%s\n%s\n' "$KEIS_LOGIN" "$KEIS_PASS" > credentials/keis.txt
          printf '%s\n%s\n' "$FW_LOGIN" "$FW_PASS" > credentials/firewhite.txt
          printf '%s\n%s\n' "$SB_LOGIN" "$SB_PASS" > credentials/steelblue.txt
          chmod 600 credentials/*.txt

      - name: "Башня — перебор локаций: где есть видимый «Бить врагов»"
        continue-on-error: true
        run: |
          python -u tools/probe_user_page.py --config deploy/config-actions-firewhite.json \
            --label fw-tower-scan --url /game/towers --tower-scan || true
          python -u tools/probe_user_page.py --config deploy/config-actions-keis.json \
            --label keis-tower-scan --url /game/towers --tower-scan || true

      - name: "Башня — воин: локация → «Бить врагов» → боевая панель"
        continue-on-error: true
        run: |
          python -u tools/probe_user_page.py --config deploy/config-actions-firewhite.json \
            --label fw-tower --url /game/towers --click-location \
            --click-text 'Бить врагов' --wait-after 6 || true

      - name: "Башня — медик: локация → «Жечь энергию врагам» → боевая панель"
        continue-on-error: true
        run: |
          python -u tools/probe_user_page.py --config deploy/config-actions-keis.json \
            --label keis-tower --url /game/towers --click-location \
            --click-text 'Жечь энергию врагам' --wait-after 6 || true

      - name: Подземелья — «Войти» → боевая панель
        continue-on-error: true
        run: |
          python -u tools/probe_user_page.py --config deploy/config-actions-firewhite.json \
            --label fw-dungeon --url /game/dungeons/1/1 --click-text 'Войти' --wait-after 6 || true

      - name: Замок — «Войти в замок» → страница захвата
        continue-on-error: true
        run: |
          python -u tools/probe_user_page.py --config deploy/config-actions-firewhite.json \
            --label fw-castle --url /castle/6 --click-text 'Войти в замок' --wait-after 6 || true

      - name: Арена — «Встать в очередь» → ждём и смотрим
        continue-on-error: true
        run: |
          python -u tools/probe_user_page.py --config deploy/config-actions-firewhite.json \
            --label fw-arena --url /game/arena --click-text 'Встать в очередь' --wait-after 40 || true

      - name: "Турнир героев — страница турнира"
        continue-on-error: true
        run: |
          python -u tools/probe_user_page.py --config deploy/config-actions-firewhite.json \
            --label fw-tournament --url /game/tournament/0/1 || true

      - name: Логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-fights-${{ github.run_number }}
          path: logs
          retention-days: 7
