name: register-steelblue

# Регистрация пятого героя на barbars.ru.
# Локально воронка нового игрока перекрыта для нашего IP, поэтому регистрация
# идёт с раннера GitHub (другой исходящий IP). Скрипт терпеливо опрашивает
# воронку и, как только форма появилась, заполняет её и отправляет.
# Пароль генерируется на раннере и кладётся в state/steelblue/credentials.json
# (оттуда его забираем в GitHub Secrets и файл удаляем).

on:
  workflow_dispatch:
    inputs:
      nick:
        description: 'Игровое имя'
        default: 'Steel Blue ii'
      kind:
        description: 'Класс: 1 — воин, 2 — медик'
        default: '1'
      side:
        description: 'Сторона: 1 — север, 2 — юг'
        default: '1'
      password:
        description: 'Пароль (пусто — сгенерировать)'
        default: ''
      tries:
        description: 'Сколько попыток опроса воронки'
        default: '120'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Регистрация
        env:
          NICK: ${{ github.event.inputs.nick }}
          KIND: ${{ github.event.inputs.kind }}
          SIDE: ${{ github.event.inputs.side }}
          PW: ${{ github.event.inputs.password }}
          TRIES: ${{ github.event.inputs.tries }}
        run: |
          python -u tools/register_hero.py "$NICK" "$KIND" "$SIDE" "$PW" "$TRIES"

      - name: Сохранить учётные данные
        if: always()
        run: |
          mkdir -p state/steelblue
          if [ -f credentials-steelblue.json ]; then
            cp credentials-steelblue.json state/steelblue/credentials.json
          else
            echo '{"error": "регистрация не завершилась"}' > state/steelblue/credentials.json
          fi
          git config user.name 'barbars-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add state/steelblue/credentials.json
          git commit -m 'state(steelblue): учётные данные нового героя' || echo 'нечего коммитить'
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)

      - name: Артефакт сессии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steelblue-registration-${{ github.run_number }}
          path: |
            knowledge/discovered/registration-steelblue*.json
            knowledge/discovered/registration-steelblue*.html
          retention-days: 5
