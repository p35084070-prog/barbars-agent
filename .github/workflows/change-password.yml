name: change-password

# Смена пароля героя на странице «Защита аккаунта».
# Нужна, когда пароль героя попал в git-историю: сначала меняем пароль в игре,
# потом чистим репозиторий и обновляем GitHub Secret.

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Логическое имя аккаунта (BARBARS_<АККАУНТ>_LOGIN/_PASSWORD)'
        required: true
        default: 'steelblue'
      new_password:
        description: 'Новый пароль (пусто — сгенерировать)'
        default: ''

permissions:
  contents: write

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Креды из секретов
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
          NEW_PW: ${{ github.event.inputs.new_password }}
        run: |
          mkdir -p credentials
          LOGIN=$(printf '%s' "${{ secrets[format('BARBARS_{0}_LOGIN', env.ACCOUNT)] }}")
          OLD_PW=$(printf '%s' "${{ secrets[format('BARBARS_{0}_PASSWORD', env.ACCOUNT)] }}")
          if [ -z "$NEW_PW" ]; then
            NEW_PW="Sb$(python -c "import secrets,string; a=string.ascii_letters+string.digits; print(''.join(secrets.choice(a) for _ in range(14)))")"
          fi
          printf '%s\n%s\n%s\n' "$LOGIN" "$OLD_PW" "$NEW_PW" > "credentials/$ACCOUNT.txt"
          chmod 600 "credentials/$ACCOUNT.txt"

      - name: Сменить пароль в игре
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEIS_LOGIN: ${{ secrets.BARBARS_KEIS_LOGIN }}
          KEIS_PASS: ${{ secrets.BARBARS_KEIS_PASSWORD }}
          FW_LOGIN: ${{ secrets.BARBARS_FIREWHITE_LOGIN }}
          FW_PASS: ${{ secrets.BARBARS_FIREWHITE_PASSWORD }}
          SB_LOGIN: ${{ secrets.BARBARS_STEELBLUE_LOGIN }}
          SB_PASS: ${{ secrets.BARBARS_STEELBLUE_PASSWORD }}
        run: |
          case "$ACCOUNT" in
            keis) LOGIN="$KEIS_LOGIN"; PW="$KEIS_PASS" ;;
            firewhite) LOGIN="$FW_LOGIN"; PW="$FW_PASS" ;;
            steelblue) LOGIN="$SB_LOGIN"; PW="$SB_PASS" ;;
            *) echo "неизвестный аккаунт: $ACCOUNT"; exit 1 ;;
          esac
          python -u tools/change_password_browser.py \
            "$LOGIN" "$PW" \
            "$(sed -n 3p credentials/$ACCOUNT.txt)" \
            --update-secret "$ACCOUNT" || echo "смена не удалась — обнови секрет вручную"
