name: probe-tower

# Где фармить железо: страница башни у fire white ii (низкий уровень).
# Только чтение.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-tower
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Учётные данные из секретов
        env:
          FW_LOGIN: ${{ secrets.BARBARS_FIREWHITE_LOGIN }}
          FW_PASS: ${{ secrets.BARBARS_FIREWHITE_PASSWORD }}
        run: |
          mkdir -p credentials
          printf '%s\n%s\n' "$FW_LOGIN" "$FW_PASS" > credentials/firewhite.txt
          chmod 600 credentials/firewhite.txt

      - name: Башня — fire white ii
        continue-on-error: true
        run: |
          python -u tools/probe_help_auction.py \
            --config deploy/config-actions-firewhite.json \
            --label fw-tower \
            --urls '/game/towers,/game/towers/map'

      - name: Логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-tower-${{ github.run_number }}
          path: logs
          retention-days: 7
