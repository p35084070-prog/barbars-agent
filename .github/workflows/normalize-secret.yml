name: normalize-secret

# Чинит креды героя в GitHub Secrets: убирает BOM/пробелы, которые остались
# после записи через PowerShell (с ними вход в игру не проходит).

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Логическое имя аккаунта'
        required: true
        default: 'steelblue'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Очистить и перезаписать секреты
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ secrets[format('BARBARS_{0}_LOGIN', env.ACCOUNT)] }}
          PASSWORD: ${{ secrets[format('BARBARS_{0}_PASSWORD', env.ACCOUNT)] }}
        run: python -u tools/normalize_secret.py "$ACCOUNT"
