name: normalize-secret

# Чинит креды героя в GitHub Secrets: убирает BOM/пробелы, которые остались
# после записи через PowerShell (с ними вход в игру не проходит).
# Имена секретов берутся напрямую: динамический доступ secrets[...] в some
# contexts не вычисляется.

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Аккаунт: keis / firewhite / steelblue'
        required: true
        default: 'steelblue'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Подготовить креды
        id: creds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEIS_LOGIN: ${{ secrets.BARBARS_KEIS_LOGIN }}
          KEIS_PASS: ${{ secrets.BARBARS_KEIS_PASSWORD }}
          FW_LOGIN: ${{ secrets.BARBARS_FIREWHITE_LOGIN }}
          FW_PASS: ${{ secrets.BARBARS_FIREWHITE_PASSWORD }}
          SB_LOGIN: ${{ secrets.BARBARS_STEELBLUE_LOGIN }}
          SB_PASS: ${{ secrets.BARBARS_STEELBLUE_PASSWORD }}
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          case "$ACCOUNT" in
            keis) LOGIN="$KEIS_LOGIN"; PW="$KEIS_PASS" ;;
            firewhite) LOGIN="$FW_LOGIN"; PW="$FW_PASS" ;;
            steelblue) LOGIN="$SB_LOGIN"; PW="$SB_PASS" ;;
            *) echo "неизвестный аккаунт: $ACCOUNT"; exit 1 ;;
          esac
          printf '%s\n%s\n' "$LOGIN" "$PW" > credentials-input.txt
          echo "длина ника: ${#LOGIN}, длина пароля: ${#PW}"

      - name: Очистить и перезаписать секреты
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCOUNT: ${{ github.event.inputs.account }}
        run: python -u tools/normalize_secret.py "$ACCOUNT"
