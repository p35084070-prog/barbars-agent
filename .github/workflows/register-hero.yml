name: register-hero

# Регистрация нового героя на barbars.ru — универсальный workflow.
# Локально воронка нового игрока перекрыта для нашего IP, поэтому регистрация
# идёт с раннера GitHub (другой исходящий IP). Скрипт терпеливо опрашивает
# воронку и, как только форма появилась, заполняет её и отправляет.
# Пароль генерируется на раннере и кладётся в state/<аккаунт>/credentials.json
# (оттуда его забираем в GitHub Secrets, файл потом удаляем).

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Логическое имя аккаунта (state/<аккаунт>, credentials-<аккаунт>.txt)'
        required: true
        default: 'steelblue'
      nick:
        description: 'Игровое имя'
        default: 'Steel Blue ii'
      kind:
        description: 'Класс: 1 — воин, 2 — медик'
        default: '1'
      side:
        description: 'Сторона: 1 — север, 2 — юг'
        default: '1'
      password:
        description: 'Пароль (пусто — сгенерировать)'
        default: ''
      tries:
        description: 'Сколько попыток опроса воронки'
        default: '120'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests

      - name: Регистрация
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
          NICK: ${{ github.event.inputs.nick }}
          KIND: ${{ github.event.inputs.kind }}
          SIDE: ${{ github.event.inputs.side }}
          PW: ${{ github.event.inputs.password }}
          TRIES: ${{ github.event.inputs.tries }}
        run: |
          python -u tools/register_hero.py "$NICK" "$KIND" "$SIDE" "$PW" "$TRIES" "$ACCOUNT"

      - name: Сохранить учётные данные
        if: always()
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          mkdir -p "state/$ACCOUNT"
          if [ -f "credentials-$ACCOUNT.json" ]; then
            cp "credentials-$ACCOUNT.json" "state/$ACCOUNT/credentials.json"
          else
            echo '{"error": "регистрация не завершилась"}' > "state/$ACCOUNT/credentials.json"
          fi
          git config user.name 'barbars-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add "state/$ACCOUNT/credentials.json"
          git commit -m "state($ACCOUNT): учётные данные нового героя" || echo 'нечего коммитить'
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)

      - name: Артефакт сессии
        if: always()
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          mkdir -p artifacts
          for f in knowledge/discovered/registration-$ACCOUNT*.json \
                   knowledge/discovered/registration-$ACCOUNT*.html; do
            [ -e "$f" ] && cp "$f" artifacts/
          done
          ls -1 artifacts || true

      - name: Опубликовать артефакт сессии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-${{ github.event.inputs.account }}-${{ github.run_number }}
          path: artifacts
          retention-days: 5
