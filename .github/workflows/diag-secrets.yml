name: diag-secrets

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Диагностика секретов
        env:
          KEIS_LOGIN: ${{ secrets.BARBARS_KEIS_LOGIN }}
          KEIS_PASS: ${{ secrets.BARBARS_KEIS_PASSWORD }}
          FW_LOGIN: ${{ secrets.BARBARS_FIREWHITE_LOGIN }}
          FW_PASS: ${{ secrets.BARBARS_FIREWHITE_PASSWORD }}
        run: |
          echo "keis_login=[$KEIS_LOGIN] len=${#KEIS_LOGIN}" >> "$GITHUB_STEP_SUMMARY"
          echo "keis_pass_len=${#KEIS_PASS} sha=$(printf '%s' "$KEIS_PASS" | sha256sum | cut -c1-16)" >> "$GITHUB_STEP_SUMMARY"
          echo "fw_login=[$FW_LOGIN] len=${#FW_LOGIN}" >> "$GITHUB_STEP_SUMMARY"
          echo "fw_pass_len=${#FW_PASS} sha=$(printf '%s' "$FW_PASS" | sha256sum | cut -c1-16)" >> "$GITHUB_STEP_SUMMARY"
          echo "keis_login_sha=$(printf '%s' "$KEIS_LOGIN" | sha256sum | cut -c1-16)" >> "$GITHUB_STEP_SUMMARY"
          echo "fw_login_sha=$(printf '%s' "$FW_LOGIN" | sha256sum | cut -c1-16)" >> "$GITHUB_STEP_SUMMARY"
