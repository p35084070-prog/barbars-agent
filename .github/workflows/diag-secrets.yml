name: diag-secrets

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Диагностика секретов
        env:
          KEIS_LOGIN: ${{ secrets.BARBARS_KEIS_LOGIN }}
          KEIS_PASS: ${{ secrets.BARBARS_KEIS_PASSWORD }}
          FW_LOGIN: ${{ secrets.BARBARS_FIREWHITE_LOGIN }}
          FW_PASS: ${{ secrets.BARBARS_FIREWHITE_PASSWORD }}
        run: |
          mkdir -p credentials
          printf '%s\n%s\n' "$FW_LOGIN" "$FW_PASS" > credentials/firewhite.txt
          printf '%s\n%s\n' "$KEIS_LOGIN" "$KEIS_PASS" > credentials/keis.txt
          echo "--- байты файла firewhite ---"
          od -c credentials/firewhite.txt | head -8
          echo "--- как это читает агент ---"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for name in ("firewhite", "keis"):
              path = Path("credentials") / f"{name}.txt"
              raw = path.read_text(encoding="utf-8")
              lines = [l.strip() for l in raw.splitlines() if l.strip()]
              print(name, "строк:", len(lines), "длины:", [len(l) for l in lines])
              for l in lines:
                  print("   sha16:", hashlib.sha256(l.encode()).hexdigest()[:16], "начало:", repr(l[:4]))
          PY
